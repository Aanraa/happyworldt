stages:
  - validate
  - build
  - deploy

image: node:20

variables:
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: '1'

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/

default:
  before_script:
    - npm ci

# Run type checking before build.
typecheck:
  stage: validate
  script:
    - npm run typecheck

# Production build for the Next.js app.
build:
  stage: build
  script:
    - npm run build
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - .next/

